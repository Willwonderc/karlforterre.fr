[lettre]
nom = La déclaration
porteur = darshan
phrases =
    Nous et rien d’autre.
    Toi et rien que toi.
    Les astres peuvent s’éteindre tant que je peux t’étreindre.
    Les mots sont encrés : plus rien ne peut les effacer.
    Darshan y glisse sa déclaration.
    Julie dans la salle de préparation voit jaillir de la fente de la pharmacie à morphiniques, un papier dont les mots sèment l’enthousiasme en elle.
    Julie s’engage sur le chemin pour rentrer, le mot serré dans sa main et contre son cœur, elle marche au contact de la caresse estivale.

[telephone]
nom = Le téléphone
porteur = julie
phrases =
    # à valider par Karl
    Tu n’as pas de téléphone, on ne peut pas s’appeler ni s’envoyer de photos, et puis tu ne m’as encore jamais invitée chez toi.
    Les pieds sur la tôle qui vibre, la tête dans les odeurs d’urine et pendant ce temps mes mains pianotent des messages pour Amélie que je n’ai pas croisée, qui comme moi n’a fait que courir, à la différence qu’elle l’a fait dans le secteur voisin.
    # à valider par Karl
    Un numéro, je me suis surprise à lui demander le sien, ce que je n’ai jamais fait.
    # à valider par Karl
    Après avoir parlé dans un premier temps devant la vitrine puis le long des trottoirs voisins, j’appris qu’il n’en avait pas et me donna rendez-vous pour le lendemain.
    Allongée sur son lit, Julie navigue sur son téléphone, elle se perd dans ses photos qui mêlent la légèreté et la maladresse d’un duo d’hurluberlus qui se bousculent naïvement.
    L’angle du téléphone les rapetisse.
    # à valider par Karl
    Plus loin dans la galerie du téléphone, une vidéo montre Darshan chanter à contre-jour de la lune une ballade romantique en italien.
    Elle tient péniblement son téléphone pour filmer la scène.

[ticket]
nom = Le ticket
porteur = julie
phrases =
    # à valider par Karl
    Son imagination l’amène à considérer au travers d’une vitrine embuée un cercle rouge de framboises cerclé de boudoirs.
    Julie repart avec son ticket, la pâtisserie qui sera sienne verra le jour dans la nuit précédant son rendez-vous.
    Elle le récupérera à onze heures et son rendez-vous est à treize heures.

[paquet]
nom = Le paquet au ruban rouge
porteur = julie
phrases =
    Cette Charlotte sera leur étendard, la matérialisation de leurs aspirations.
    Le ventre tendu, noué, mais empli du frétillement de l’impatience que l’on caractérise par l’image de papillons, Julie va à la rencontre de Darshan avec son petit paquet à la main.
    Son nœud vacille au vent comme son cœur.
    Julie seule et déboussolée n’a que ses lierres ainsi que son paquet au ruban rouge à la main pour réaliser ce qui vient de se passer.
    # c'est le paquet de Darshan qui passe à Julie, mais la phrase se lit dans la fiche du paquet qu'elle garde
    Julie prend le paquet, le tient derrière elle, puis fléchit en avant sous le poids de l’affection.

# Le paquet de Darshan (arbitrage 8 de la direction) : le même nom et le même ruban que celui de Julie ;
# il entre dans son sac sans annonce en 7.9 et le quitte sans annonce en 7.11 (Julie n'en porte qu'un) ;
# son dessin est celui de « paquet ».
[paquet-darshan]
nom = Le paquet au ruban rouge
porteur = darshan
phrases =
    Trente mètres plus loin, elle court à la vue de Darshan, il porte à la main un paquet au ruban rouge.
    Il porte à hauteur d’épaule un petit paquet et son nœud rouge qu’il expose à la volonté de Julie ainsi qu’à la brise.
    Le ruban de satin s’affole, il ne sait pas où donner de la tête au cœur du maelström.

