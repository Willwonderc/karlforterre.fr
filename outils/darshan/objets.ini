# Les objets du livre jouable : leur nom, qui les porte, et les phrases du livre qui parlent
# d'eux. Karl peut corriger ce fichier sans toucher au programme.
#
# - nom : le nom affiché sur la fiche (texte d'interface, à valider par Karl) ;
# - porteur : darshan ou julie (le sac où l'objet arrive) ;
# - phrases : une phrase du livre par ligne, recopiée mot pour mot (les espaces avant « ; : ? ! »
#   et les apostrophes droites ou courbes sont acceptées telles quelles). La fabrication
#   (build.py) cherche chaque phrase dans le livre et refuse celles qui n'y sont pas ; le livre
#   n'affiche une phrase qu'une fois que le lecteur l'a lue ;
# - metamorphose : le fragment du livre affiché en grand quand l'objet naît d'une métamorphose.
#
# Les lignes qui commencent par # sont des commentaires. Les phrases ajoutées par la pré-production
# (docs/darshan-mise-en-scene/synthese.md, partie 7.1) sont précédées de « # à valider par Karl ».

[lunettes]
nom = Les lunettes fumées
porteur = darshan
phrases =
    Ses lunettes fumées sur le nez, son gilet de toile sans manches en prise avec le vent, Darshan danse sur les tuiles jusqu’au pigeonnier.
    Face à l’assemblage de grilles et de bois, il ôte ses lunettes.
    Les tenant par la branche, elles vibrent entre ses doigts, leurs couleurs s’altèrent.
    Il se défait de ses lunettes puis disparaît loin de la vue de Jivan qui range patiemment son filet.
    Sa capacité à tordre la réalité subjugue ; ses lunettes aux visages déformés adoptent l’allure de la précédente clé.
    Elles portent sa vue plus loin que si elles s’étaient gardées de rester sur son nez.
    # à valider par Karl (synthèse 7.1 : si Karl l'accepte)
    Il met en valeur le regard couleur terre qui perce les lunettes du révolu don Juan.
    Des lunettes avec lesquelles il se montre bien coquet, elles changent assez régulièrement, remarque Julie en parcourant les photos.
    Ça te change de ne pas les porter, c’est des lunettes de vue ?
    Des lunettes de vue, c’est ça, je suis encore plus coquet qu’il n’y paraît, il ne faut pas se fier aux apparences.
    # en 7.8, ce sont les lunettes : la clé redevient lunettes à la fin de 6.15
    Ses lunettes rejoignent sa main puis la serrure du local.

[binocles]
nom = Les binocles
porteur = darshan
phrases =
    Darshan pose sur son nez une paire de binocles ronds pincés au bout de fines tiges grises qui rejoignent ses oreilles.
    Julie sourit devant cet excentrisme.
    Il se saisit de ses lunettes et d’un mouvement de poignet les change en clés.

[cle]
nom = La clé
porteur = darshan
metamorphose = elles se transforment
phrases =
    D’un geste vif, digne d’un prestidigitateur, elles se transforment, passant de lunettes à une clé au format pincé.
    Elle est adaptée à la porte par sa finesse ; assortie aux grillages par ses rayures et sa rouille.
    Elle est affrétée pour l’amener où son cœur l’emportera.
    Dans le même temps qu’elles se plient, elles en font autant de l’espace, faisant plus que de vulgaires bottes de sept lieux.
    La clé de sa chambre est la sincérité et sa porte la réciprocité.
    Oui bien sûr, laisse-moi un instant, je vais ouvrir, la clé est dans ma poche…
    La monture des lunettes de Darshan s’est fondue le temps d’un instant en une matière visqueuse qui se rétracte pour s’affiner pour devenir une clé entre les doigts du bohème.
    Il la ferme et cache par là même les linges de bains qui étaient visibles, il insère une clé de laiton un peu oxydé, puis rouvre le meuble.

[montre]
nom = La montre
porteur = darshan
phrases =
    Après quelques ajustements et regards attentifs sur sa montre, Darshan s’incline auprès de son ami avant de tourner ses talons vers la cabane à kayaks.

[recueil]
nom = Le recueil de poèmes
porteur = darshan
phrases =
    Darshan pour sa part parcourt un recueil de poèmes sanskrits.
    L’amour est le lit de la famille.
    La clé de sa chambre est la sincérité et sa porte la réciprocité.
    Il quitte sa table avec son ouvrage sous le bras et disparaît avec nonchalance entre deux battements de porte des toilettes du personnel.

[thes]
nom = Les thés
porteur = darshan
phrases =
