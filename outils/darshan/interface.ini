# Tous les textes d'interface du livre jouable : les seuls textes qui ne sont pas de Karl.
# Karl les valide et peut les corriger ici sans toucher au programme ; la fabrication
# (build.py) refuse un texte d'interface qui ne vient pas de ce fichier, et un geste sans
# consigne. Les lignes qui commencent par # sont des commentaires. Les textes nouveaux ou
# changés par la pré-production (docs/darshan-mise-en-scene/synthese.md, partie 6) sont
# précédés de « # à valider par Karl » : huit mots au plus, dans le vocabulaire du livre.

