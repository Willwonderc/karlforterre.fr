# Les fiches des portes du carnet : les phrases du livre qui parlent de chaque porte. Karl peut
# corriger ce fichier sans toucher au programme. Même format qu'objets.ini (synthèse, partie 7.2) :
#
# - une rubrique par porte, sous le nom du carnet (livre.PORTES) ; les libellés des portes restent
#   dans interface.ini, rubrique [portes] : ce fichier n'a que des phrases du livre ;
# - phrases : une phrase du livre par ligne, recopiée mot pour mot ; la fabrication (build.py) la
#   cherche dans le livre et refuse celles qui n'y sont pas, ou qui y sont plusieurs fois. La fiche
#   n'affiche une phrase qu'une fois lue, et quand la porte est au carnet ;
# - une phrase lue avant la naissance de l'étoile peut avoir sa clé d'entrée, écrite entre
#   crochets après elle : la phrase du livre qui la fait entrer dans la fiche (vérifiée comme elle) ;
# - la fiche de la porte du père n'a pas de dessin de clé, la seule (7.13 : la clé n'est pas
#   proposée) ; au désenchantement (7.14), elle s'éteint avec les autres.
#
# Les lignes qui commencent par # sont des commentaires. Toutes ces fiches sont nouvelles :
# à valider par Karl.

# 1.3, 1.4
[pigeonnier]
phrases =
    Après un tour de poignet, la porte se déconsolide de la charpente.
    Il ne reste qu’à la pousser pour rejoindre dans le Kerala, la ville d’Aluva.
    Notre héros affleure de la poussière en passant le seuil d’un local à kayaks.

